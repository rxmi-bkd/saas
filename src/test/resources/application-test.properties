spring.liquibase.contexts=test

app.scheduling.enabled=false

app.jwt.authentication-token.secret=${JWT_AUTHENTICATION_TOKEN_SECRET:dev-only-authentication-token-secret-change-me-0123456789}
app.jwt.authentication-token.expiration=${JWT_AUTHENTICATION_TOKEN_EXPIRATION:300}
app.jwt.reset-password-token.secret=${JWT_RESET_PASSWORD_TOKEN_SECRET:dev-only-reset-password-token-secret-change-me-0123456789}
app.jwt.reset-password-token.expiration=${JWT_RESET_PASSWORD_TOKEN_EXPIRATION:300}

app.social-authentication.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
app.social-authentication.google.client-secret=${GOOGLE_SECRET:google-client-secret}
app.jwt.activation-token.secret=${JWT_ACTIVATION_TOKEN_SECRET:dev-only-activation-token-secret-change-me-0123456789}
app.jwt.activation-token.expiration=${JWT_ACTIVATION_TOKEN_EXPIRATION:86400}
