spring.application.name=saas

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration
spring.liquibase.enabled=true

# JWT Configuration
app.jwt.reset-password-token.secret=${JWT_RESET_PASSWORD_TOKEN_SECRET}
app.jwt.reset-password-token.expiration=${JWT_RESET_PASSWORD_TOKEN_EXPIRATION}
app.jwt.activation-token.secret=${JWT_ACTIVATION_TOKEN_SECRET}
app.jwt.activation-token.expiration=${JWT_ACTIVATION_TOKEN_EXPIRATION}