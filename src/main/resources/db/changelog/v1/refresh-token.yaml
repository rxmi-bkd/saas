databaseChangeLog:
  - changeSet:
      id: 1790700000000-1
      author: bouka
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_token
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: family_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: DATETIME
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: refresh_token
            columnNames: hash
            constraintName: uc_refresh_token_hash
        - addForeignKeyConstraint:
            baseTableName: refresh_token
            baseColumnNames: user_id
            constraintName: fk_refresh_token_on_user
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: refresh_token
            indexName: idx_refresh_token_family_id
            columns:
              - column:
                  name: family_id
