databaseChangeLog:
  - changeSet:
      id: 1790550005793-1
      author: bouka
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createSequence:
            incrementBy: 50
            sequenceName: revinfo_seq
            startValue: 1
