spring.liquibase.contexts=local

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

app.jwt.reset-password-token.secret=${JWT_RESET_PASSWORD_TOKEN_SECRET:dev-only-reset-password-token-secret-change-me-0123456789}
app.jwt.reset-password-token.expiration=${JWT_RESET_PASSWORD_TOKEN_EXPIRATION:300}
app.jwt.activation-token.secret=${JWT_ACTIVATION_TOKEN_SECRET:dev-only-activation-token-secret-change-me-0123456789}
app.jwt.activation-token.expiration=${JWT_ACTIVATION_TOKEN_EXPIRATION:300}

app.security.csrf.enabled=false

spring.docker.compose.file=compose.yml

server.servlet.session.cookie.secure=false

app.security.rate-limit.enabled=true

