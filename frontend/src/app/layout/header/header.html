<header class="flex items-center justify-between border-b-4 border-ink bg-main px-6 py-4">
  <a [routerLink]="ROUTE_URLS.home" class="text-2xl font-black no-underline"> SaaS </a>
  <nav>
    <ul class="flex items-center gap-4">
      @if (isAuthenticated()) {
        <li>
          <a [routerLink]="ROUTE_URLS.profile">{{ 'nav.profile' | transloco }}</a>
        </li>

        @if (isAdmin()) {
          <li>
            <a [routerLink]="ROUTE_URLS.admin">{{ 'nav.admin' | transloco }}</a>
          </li>
        }
        <li>
          <button type="button" class="brutal-btn bg-white" (click)="logout()">{{ 'nav.logout' | transloco }}</button>
        </li>
      } @else {
        <li>
          <a [routerLink]="ROUTE_URLS.signIn" class="brutal-btn bg-white">{{ 'nav.signIn' | transloco }}</a>
        </li>
      }
      <li>
        <app-language-selector />
      </li>
    </ul>
  </nav>
</header>
