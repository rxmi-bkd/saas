<header
  class="flex items-center justify-between border-b-4 border-ink bg-main px-6 py-4"
>
  <a [routerLink]="ROUTE_URLS.home" class="text-2xl font-black no-underline">
    SaaS
  </a>
  <nav>
    <ul class="flex items-center gap-4">
      @if (isAuthenticated()) {
        <li>
          <a [routerLink]="ROUTE_URLS.profile">Profile</a>
        </li>

        @if (isAdmin()) {
          <li>
            <a [routerLink]="ROUTE_URLS.admin">Admin</a>
          </li>
        }
        <li>
          <button type="button" class="brutal-btn bg-white" (click)="logout()">
            Logout
          </button>
        </li>
      } @else {
        <li>
          <a [routerLink]="ROUTE_URLS.signIn" class="brutal-btn bg-white">Sign In</a>
        </li>
      }
    </ul>
  </nav>
</header>
