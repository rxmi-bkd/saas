@switch (state()) {
  @case ('pending') {
    <app-reset-password-form [token]="token()" (reset)="state.set('reset')" (invalidToken)="state.set('invalid')" />
  }
  @case ('reset') {
    <div class="grid place-items-center gap-6 text-center">
      <h1>Password updated</h1>
      <p>Your password has been reset. You can now sign in.</p>
      <a [routerLink]="ROUTE_URLS.signIn">Go to sign in</a>
    </div>
  }
  @case ('invalid') {
    <div class="grid place-items-center gap-6 text-center">
      <h1>Invalid or expired link</h1>
      <p>This reset link is invalid or has expired.</p>
      <a [routerLink]="ROUTE_URLS.forgotPassword">Request a new link</a>
    </div>
  }
}
