@switch (state()) {
  @case ('pending') {
    <app-reset-password-form [token]="token()" (reset)="onReset()" />
  }
  @case ('reset') {
    <app-status-message
      heading="Password updated"
      description="Your password has been reset. You can now sign in."
      linkLabel="Go to sign in"
      [linkUrl]="ROUTE_URLS.signIn"
    />
  }
}
