<app-form
  class="mx-auto mt-12 max-w-md"
  heading="Login"
  submitLabel="Log in"
  [form]="loginForm"
>
  <app-input
    label="Email"
    type="email"
    [formField]="loginForm.email"
  />

  <app-input
    label="Password"
    type="password"
    [formField]="loginForm.password"
  />
</app-form>
