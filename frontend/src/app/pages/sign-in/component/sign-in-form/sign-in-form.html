<app-form header="Sign in" i18n-header label="Sign in" i18n-label [form]="signInForm">
  <app-input label="Email" i18n-label type="email" [formField]="signInForm.email" />

  <app-input label="Password" i18n-label type="password" [formField]="signInForm.password" />
</app-form>

<div class="flex justify-center gap-6">
  <a class="mt-6" [routerLink]="ROUTE_URLS.signUp" i18n>No account yet ? Sign up</a>
  <a class="mt-6" [routerLink]="ROUTE_URLS.forgotPassword" i18n>Forgot your password ?</a>
</div>
