<app-form header="Sign in" label="Sign in" [form]="signInForm">
  <app-input label="Email" type="email" [formField]="signInForm.email" />

  <app-input label="Password" type="password" [formField]="signInForm.password" />
</app-form>

<div class="flex justify-center gap-6">
  <a class="mt-6" [routerLink]="ROUTE_URLS.signUp">No account yet ? Sign up</a>
  <a class="mt-6" [routerLink]="ROUTE_URLS.forgotPassword">Forgot your password ?</a>
</div>
