<p>profile</p>
@if (user(); as user) {
  <dl class="brutal-card">
    <dt>{{ 'profile.email' | transloco }}</dt>
    <dd>{{ user.email }}</dd>
    <dt>{{ 'profile.role' | transloco }}</dt>
    <dd>{{ user.role }}</dd>
    <dt>{{ 'profile.memberSince' | transloco }}</dt>
    <dd>{{ user.createdAt | date: 'mediumDate' : undefined : language() }}</dd>
  </dl>
}
