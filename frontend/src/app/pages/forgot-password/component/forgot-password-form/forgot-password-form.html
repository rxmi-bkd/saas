<app-form
  [header]="'forgotPassword.header' | transloco"
  [label]="'forgotPassword.submit' | transloco"
  [form]="forgotPasswordForm"
  [cooldown]="60"
>
  <app-input [label]="'label.email' | transloco" type="email" [formField]="forgotPasswordForm.email" />
</app-form>

<div class="grid place-items-center gap-6 mt-6">
  @if (sent()) {
    <p>{{ 'forgotPassword.sent' | transloco }}</p>
  }
  <a [routerLink]="ROUTE_URLS.signIn">{{ 'forgotPassword.backToSignIn' | transloco }}</a>
</div>
