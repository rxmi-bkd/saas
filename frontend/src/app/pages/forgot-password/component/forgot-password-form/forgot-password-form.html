<app-form
  header="Forgot password"
  i18n-header
  label="Send reset email"
  i18n-label
  [form]="forgotPasswordForm"
  [cooldown]="60"
>
  <app-input label="Email" i18n-label type="email" [formField]="forgotPasswordForm.email" />
</app-form>

<div class="grid place-items-center gap-6 mt-6">
  @if (sent()) {
    <p i18n>If an account exists for this email, a reset link has been sent.</p>
  }
  <a [routerLink]="ROUTE_URLS.signIn" i18n>Back to sign in</a>
</div>
