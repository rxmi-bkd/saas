<app-form header="Forgot password" label="Send reset email" [form]="forgotPasswordForm" [cooldown]="60">
  <app-input label="Email" type="email" [formField]="forgotPasswordForm.email" />
</app-form>

<div class="grid place-items-center gap-6 mt-6">
  @if (sent()) {
    <p>If an account exists for this email, a reset link has been sent.</p>
  }
  <a [routerLink]="ROUTE_URLS.signIn">Back to sign in</a>
</div>
