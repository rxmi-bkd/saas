@switch (state()) {
  @case ('loading') {
    <p>{{ 'enableAccount.loading' | transloco }}</p>
  }
  @case ('enabled') {
    <app-status-message
      [heading]="'enableAccount.enabled.heading' | transloco"
      [description]="'enableAccount.enabled.description' | transloco"
      [linkLabel]="'enableAccount.enabled.link' | transloco"
      [linkUrl]="ROUTE_URLS.signIn"
    />
  }
  @case ('invalid') {
    <app-status-message
      [heading]="'enableAccount.invalid.heading' | transloco"
      [description]="'enableAccount.invalid.description' | transloco"
      [linkLabel]="'enableAccount.invalid.link' | transloco"
      [linkUrl]="ROUTE_URLS.signIn"
    />
  }
  @case ('error') {
    <app-status-message
      [heading]="'enableAccount.error.heading' | transloco"
      [description]="'enableAccount.error.description' | transloco"
      [linkLabel]="'enableAccount.error.link' | transloco"
      [linkUrl]="ROUTE_URLS.signIn"
    />
  }
  @case ('pending') {
    <app-status-message
      [heading]="'enableAccount.pending.heading' | transloco"
      [description]="'enableAccount.pending.description' | transloco"
      [linkLabel]="'enableAccount.pending.link' | transloco"
      [linkUrl]="ROUTE_URLS.signIn"
    />
  }
}
