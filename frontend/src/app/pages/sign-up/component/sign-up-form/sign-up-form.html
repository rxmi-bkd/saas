<app-form header="Sign up" i18n-header label="Sign up" i18n-label [form]="signUpForm">
  <app-input label="Email" i18n-label type="email" [formField]="signUpForm.email" />

  <app-input label="Password" i18n-label type="password" [formField]="signUpForm.password" />
</app-form>

<div class="flex justify-center">
  <a class="mt-6" [routerLink]="ROUTE_URLS.signIn" i18n>Already have an account ? Sign in</a>
</div>
