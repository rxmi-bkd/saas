<app-form [header]="'signUp.header' | transloco" [label]="'signUp.submit' | transloco" [form]="signUpForm">
  <app-input [label]="'label.email' | transloco" type="email" [formField]="signUpForm.email" />

  <app-input [label]="'label.password' | transloco" type="password" [formField]="signUpForm.password" />
</app-form>

<div class="flex justify-center">
  <a class="mt-6" [routerLink]="ROUTE_URLS.signIn">{{ 'signUp.haveAccount' | transloco }}</a>
</div>
